name: Playwright CI

on:
  push:
    branches: [ Main, Avengers, nodug ] # entha branch push panna odanum nu
  pull_request:
    branches: [ Main ]
  workflow_dispatch: # manual ah run panna

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run Tests
        run: npx playwright test
